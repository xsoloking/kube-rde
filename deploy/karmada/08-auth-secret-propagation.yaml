# Propagate the kuberde-agents-auth Secret to all member clusters.
# The operator on each member cluster reads this secret from the kuberde namespace
# and copies it into each team namespace so agent pods can authenticate.
#
# Prerequisites:
#   1. The kuberde-agents-auth Secret must exist in the kuberde namespace on the
#      Karmada API server (copy from hub):
#        kubectl get secret kuberde-agents-auth -n kuberde -o json | \
#          python3 -c "import sys,json; s=json.load(sys.stdin); s['metadata']={'name':'kuberde-agents-auth','namespace':'kuberde'}; print(json.dumps(s))" | \
#          kubectl apply --kubeconfig=/path/to/karmada.config -f -
#
#   2. Member clusters joined and labeled: kubectl label cluster <name> kuberde.io/member=true
---
apiVersion: policy.karmada.io/v1alpha1
kind: ClusterPropagationPolicy
metadata:
  name: kuberde-agents-auth-propagation
spec:
  resourceSelectors:
  - apiVersion: v1
    kind: Secret
    name: kuberde-agents-auth
    namespace: kuberde
  placement:
    clusterAffinity:
      labelSelector:
        matchLabels:
          kuberde.io/member: "true"
  conflictResolution: Overwrite
